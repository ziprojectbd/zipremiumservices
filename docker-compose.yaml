# ============================================
# ZI Premium Services — Production Docker Compose
# Compatible: Coolify, Docker Compose v2, Alpine
# ============================================

x-common-backend: &common-backend
  build:
    context: ./backend
    dockerfile: Dockerfile
    args:
      NODE_ENV: production
  restart: unless-stopped
  networks:
    - coolify
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: "0.50"

services:
  # -------------------------------------------------
  # Backend — Express.js API (Node.js 22 LTS)
  # -------------------------------------------------
  backend:
    <<: *common-backend
    container_name: zipremium-backend
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-5000}
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CAPTCHAMASTER_API_KEY=${CAPTCHAMASTER_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ONESERVICEBD_API_KEY=${ONESERVICEBD_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLIENT_URL=${CLIENT_URL}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "-O", "/dev/null", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # -------------------------------------------------
  # Frontend — React SPA + Nginx 1.27 reverse proxy
  # -------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zipremium-frontend
    restart: unless-stopped
    networks:
      - coolify
    ports:
      - "80:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(\`zipremiumservices.com\`) || Host(\`www.zipremiumservices.com\`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

networks:
  coolify:
    external: true
