# ============================================
# ZI Premium Services — nginx Production Config
# ============================================
# Serves Vite/React SPA, proxies /api to backend
# ============================================

upstream backend {
    server backend:5000;
}

# www → non-www redirect
server {
    listen 80;
    server_name www.zipremiumservices.com;
    return 301 https://zipremiumservices.com$request_uri;
}

server {
    listen 80;
    server_name zipremiumservices.com;

    # ---------- Root & Index ----------
    root /usr/share/nginx/html;
    index index.html;

    # ---------- Security Headers ----------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ---------- Gzip ----------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;
    gzip_proxied any;

    # ---------- Static Assets (fingerprinted by Vite — cache forever) ----------
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    # ---------- SPA Routing ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- API Proxy ----------
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---------- Backend Health Check ----------
    location = /health {
        proxy_pass http://backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- Deny Hidden Files ----------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---------- Deny Sensitive Files ----------
    location ~* (Dockerfile|\.env|\.git|nginx\.conf|composer\.json|package\.json|yarn\.lock|package-lock\.json)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
